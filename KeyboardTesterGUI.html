<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keyboard Tester</title>
  <style>
    :root {
      --bg: #101723;
      --panel: #182437;
      --panel-2: #1e2c42;
      --text: #f8fafc;
      --muted: #9db2ce;
      --key-default: #e6edf5;
      --key-text: #132033;
      --key-green: #43c46b;
      --key-orange: #f0a54a;
      --accent: #2563eb;
      --accent-off: #334155;
      --yellow: #fbbf24;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
    }

    .app {
      max-width: 1450px;
      margin: 0 auto;
      padding: 18px;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 18px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .toggle-box, .log-box {
      background: var(--panel);
      border-radius: 14px;
    }

    .toggle-box {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 12px;
    }

    .toggle-label {
      font-weight: 700;
    }

    .switch-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 700;
    }

    .switch {
      width: 68px;
      height: 30px;
      border-radius: 999px;
      background: var(--accent);
      position: relative;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    .switch.compact {
      background: var(--accent-off);
    }

    .switch-knob {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #f8fafc;
      position: absolute;
      top: 3px;
      left: 40px;
      transition: left 0.18s ease;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }

    .switch.compact .switch-knob {
      left: 4px;
    }

    .reset-btn {
      background: var(--yellow);
      color: #0f172a;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .keyboard-wrap {
      display: flex;
      gap: 22px;
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .cluster {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      display: flex;
      gap: 6px;
    }

    .key {
      border: 0;
      border-radius: 10px;
      min-width: 48px;
      height: 48px;
      background: var(--key-default);
      color: var(--key-text);
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
      transition: transform 0.06s ease;
      white-space: nowrap;
    }

    .key:active {
      transform: translateY(1px);
    }

    .key.state-1 {
      background: var(--key-green);
    }

    .key.state-2 {
      background: var(--key-orange);
    }

    .log-box {
      margin-top: 18px;
      padding: 16px 18px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.5;
      color: var(--text);
      word-break: break-word;
    }

    @media (max-width: 900px) {
      .title { font-size: 26px; }
      .log-box { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 class="title">Keyboard Tester</h1>
    <p class="subtitle">Toggle between compact and full layouts. Click keys or press your real keyboard to test.</p>

    <div class="controls">
      <div class="toggle-box">
        <span class="toggle-label">Layout</span>
        <div class="switch-wrap">
          <span>Compact KB</span>
          <div id="layoutSwitch" class="switch" role="button" tabindex="0" aria-label="Toggle keyboard layout">
            <div class="switch-knob"></div>
          </div>
          <span>Full KB</span>
        </div>
      </div>

      <button id="resetBtn" class="reset-btn">Reset Colors</button>
    </div>

    <div id="keyboardWrap" class="keyboard-wrap"></div>

    <div id="keyLog" class="log-box">Key log:</div>
  </div>

  <script>
    const COMPACT_LAYOUT = [
      [
        ["Esc", "Escape", 1.0],
        ["F1", "F1", 1.0], ["F2", "F2", 1.0], ["F3", "F3", 1.0], ["F4", "F4", 1.0],
        ["F5", "F5", 1.0], ["F6", "F6", 1.0], ["F7", "F7", 1.0], ["F8", "F8", 1.0],
        ["F9", "F9", 1.0], ["F10", "F10", 1.0], ["F11", "F11", 1.0], ["F12", "F12", 1.0],
      ],
      [
        ["`", "grave", 1.0], ["1", "1", 1.0], ["2", "2", 1.0], ["3", "3", 1.0], ["4", "4", 1.0],
        ["5", "5", 1.0], ["6", "6", 1.0], ["7", "7", 1.0], ["8", "8", 1.0], ["9", "9", 1.0],
        ["0", "0", 1.0], ["-", "minus", 1.0], ["=", "equal", 1.0], ["Backspace", "BackSpace", 2.1],
      ],
      [
        ["Tab", "Tab", 1.5], ["Q", "q", 1.0], ["W", "w", 1.0], ["E", "e", 1.0], ["R", "r", 1.0],
        ["T", "t", 1.0], ["Y", "y", 1.0], ["U", "u", 1.0], ["I", "i", 1.0], ["O", "o", 1.0],
        ["P", "p", 1.0], ["[", "bracketleft", 1.0], ["]", "bracketright", 1.0], ["\\", "backslash", 1.6],
      ],
      [
        ["Caps", "Caps_Lock", 1.8], ["A", "a", 1.0], ["S", "s", 1.0], ["D", "d", 1.0], ["F", "f", 1.0],
        ["G", "g", 1.0], ["H", "h", 1.0], ["J", "j", 1.0], ["K", "k", 1.0], ["L", "l", 1.0],
        [";", "semicolon", 1.0], ["'", "apostrophe", 1.0], ["Enter", "Return", 2.3],
      ],
      [
        ["Shift", "Shift_L", 2.3], ["Z", "z", 1.0], ["X", "x", 1.0], ["C", "c", 1.0], ["V", "v", 1.0],
        ["B", "b", 1.0], ["N", "n", 1.0], ["M", "m", 1.0], [",", "comma", 1.0], [".", "period", 1.0],
        ["/", "slash", 1.0], ["Shift", "Shift_R", 2.7],
      ],
      [
        ["Ctrl", "Control_L", 1.3], ["Win", "Super_L", 1.2], ["Alt", "Alt_L", 1.2],
        ["Space", "space", 6.6],
        ["Alt", "Alt_R", 1.2], ["Fn", "fn", 1.2], ["Menu", "Menu", 1.2], ["Ctrl", "Control_R", 1.3],
      ],
      [
        ["Ins", "Insert", 1.0], ["Home", "Home", 1.0], ["PgUp", "Prior", 1.0],
        ["Del", "Delete", 1.0], ["End", "End", 1.0], ["PgDn", "Next", 1.0],
        ["Up", "Up", 1.0],
      ],
      [
        ["Left", "Left", 1.0], ["Down", "Down", 1.0], ["Right", "Right", 1.0],
      ],
    ];

    const NUMPAD_LAYOUT = [
      [["Num", "Num_Lock", 1.0], ["/", "KP_Divide", 1.0], ["*", "KP_Multiply", 1.0], ["-", "KP_Subtract", 1.0]],
      [["7", "KP_7", 1.0], ["8", "KP_8", 1.0], ["9", "KP_9", 1.0], ["+", "KP_Add", 1.0]],
      [["4", "KP_4", 1.0], ["5", "KP_5", 1.0], ["6", "KP_6", 1.0]],
      [["1", "KP_1", 1.0], ["2", "KP_2", 1.0], ["3", "KP_3", 1.0], ["Enter", "KP_Enter", 1.0]],
      [["0", "KP_0", 2.0], [".", "KP_Decimal", 1.0]],
    ];

    const KEY_ALIASES = {
      Escape: "Escape",
      Backspace: "BackSpace",
      Enter: "Return",
      " ": "space",
      "`": "grave",
      "-": "minus",
      "=": "equal",
      "[": "bracketleft",
      "]": "bracketright",
      "\\": "backslash",
      ";": "semicolon",
      "'": "apostrophe",
      ",": "comma",
      ".": "period",
      "/": "slash",
    };

    const keyboardWrap = document.getElementById("keyboardWrap");
    const keyLog = document.getElementById("keyLog");
    const resetBtn = document.getElementById("resetBtn");
    const layoutSwitch = document.getElementById("layoutSwitch");

    let layoutMode = "full";
    const keyStates = new Map();
    const keyButtons = new Map();

    function colorForState(state) {
      if (state === 1) return "state-1";
      if (state === 2) return "state-2";
      return "";
    }

    function createCluster(layout) {
      const cluster = document.createElement("div");
      cluster.className = "cluster";

      layout.forEach((row) => {
        const rowEl = document.createElement("div");
        rowEl.className = "row";

        row.forEach(([label, keyId, width]) => {
          const button = document.createElement("button");
          button.className = "key";
          button.textContent = label;
          button.style.width = `${Math.max(48, width * 52)}px`;
          button.dataset.keyId = keyId;
          button.addEventListener("click", () => registerKey(keyId, label));

          const stateClass = colorForState(keyStates.get(keyId) || 0);
          if (stateClass) button.classList.add(stateClass);

          keyButtons.set(keyId, button);
          rowEl.appendChild(button);
        });

        cluster.appendChild(rowEl);
      });

      return cluster;
    }

    function renderKeyboard() {
      keyboardWrap.innerHTML = "";
      keyButtons.clear();

      keyboardWrap.appendChild(createCluster(COMPACT_LAYOUT));
      if (layoutMode === "full") {
        keyboardWrap.appendChild(createCluster(NUMPAD_LAYOUT));
      }
    }

    function registerKey(keyId, keyLabel) {
      const currentState = keyStates.get(keyId) || 0;
      const nextState = currentState === 0 ? 1 : 2;
      keyStates.set(keyId, nextState);

      const currentLog = keyLog.textContent.replace("Key log:", "").trim();
      keyLog.textContent = currentLog ? `Key log: ${currentLog} ${keyLabel}` : `Key log: ${keyLabel}`;

      const button = keyButtons.get(keyId);
      if (button) {
        button.classList.remove("state-1", "state-2");
        const stateClass = colorForState(nextState);
        if (stateClass) button.classList.add(stateClass);
      }
    }

    function updateSwitch() {
      layoutSwitch.classList.toggle("compact", layoutMode === "compact");
    }

    function toggleLayout() {
      layoutMode = layoutMode === "full" ? "compact" : "full";
      updateSwitch();
      renderKeyboard();
    }

    layoutSwitch.addEventListener("click", toggleLayout);
    layoutSwitch.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleLayout();
      }
    });

    resetBtn.addEventListener("click", () => {
      keyStates.clear();
      keyLog.textContent = "Key log:";
      renderKeyboard();
    });

    window.addEventListener("keydown", (event) => {
      let keyId = event.key;
      let keyLabel = event.key === " " ? "Space" : event.key;

      if (keyButtons.has(event.key)) {
        registerKey(event.key, keyLabel);
        return;
      }

      if (keyButtons.has(event.code)) {
        registerKey(event.code, keyLabel);
        return;
      }

      const aliasKey = KEY_ALIASES[event.key] || KEY_ALIASES[event.code];
      if (aliasKey && keyButtons.has(aliasKey)) {
        registerKey(aliasKey, keyLabel);
        return;
      }

      const lowerKey = typeof keyId === "string" ? keyId.toLowerCase() : keyId;
      if (keyButtons.has(lowerKey)) {
        registerKey(lowerKey, keyLabel);
      }
    });

    updateSwitch();
    renderKeyboard();
  </script>
</body>
</html>
