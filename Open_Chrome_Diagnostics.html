<!DOCTYPE html>
<html>
<head>
    <title>Open Chrome Diagnostics</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            padding: 15px 30px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
            color: white;
            font-weight: bold;
            background: #2563eb;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .instructions {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Chrome OS Diagnostics</h1>
        <button onclick="openDiagnostics()" class="btn">Open Keyboard Diagnostics</button>
        <div class="instructions">
            <p>Click the button to open Chrome's built-in keyboard diagnostics directly.</p>
            <p>This will open the input devices section which includes keyboard testing.</p>
            <p><strong>If clicking doesn't work:</strong> Copy this URL and paste it in Chrome's address bar:</p>
            <p style="font-family: monospace; background: #f0f0f0; padding: 10px; border-radius: 5px;">chrome://diagnostics/input</p>
        </div>
    </div>

    <script>
        function openDiagnostics() {
            window.open('chrome://diagnostics/input', '_blank');
        }
    </script>
</body>
</html>
